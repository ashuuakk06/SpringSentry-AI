spring.application.name=springsentry-ai
server.port=8081

# Local runs use an embedded file database so no database server is needed.
spring.datasource.url=${SPRINGSENTRY_DB_URL:jdbc:h2:file:./data/springsentry;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRINGSENTRY_DB_USERNAME:sa}
spring.datasource.password=${SPRINGSENTRY_DB_PASSWORD:}
spring.datasource.driver-class-name=${SPRINGSENTRY_DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Keep the key server-side. Empty key enables clearly labelled demo analysis.
bharatcode.base-url=${BHARATCODE_BASE_URL:https://bharatcode.ai/api/model/v1}
bharatcode.api-key=${BHARATCODE_API_KEY:}
bharatcode.model=${BHARATCODE_MODEL:qwen-3.8-27b}
bharatcode.connect-timeout=8s
bharatcode.read-timeout=35s

springsentry.jwt-secret=${SPRINGSENTRY_JWT_SECRET:}
springsentry.jwt-expiration-hours=24
springsentry.allowed-origin=${SPRINGSENTRY_ALLOWED_ORIGIN:http://localhost:5173}
springsentry.sample-project-dir=${SPRINGSENTRY_SAMPLE_PROJECT_DIR:../sample-projects/calculator}
