spring.datasource.url=${SPRINGSENTRY_DB_URL:jdbc:postgresql://localhost:5432/springsentry}
spring.datasource.username=${SPRINGSENTRY_DB_USERNAME:springsentry}
spring.datasource.password=${SPRINGSENTRY_DB_PASSWORD:springsentry-local-only}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
