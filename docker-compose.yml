services:
  postgres:
    image: postgres:17-alpine
    container_name: springsentry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: springsentry
      POSTGRES_USER: springsentry
      POSTGRES_PASSWORD: ${SPRINGSENTRY_DB_PASSWORD:-springsentry-local-only}
    ports:
      - "5432:5432"
    volumes:
      - springsentry-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springsentry -d springsentry"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  springsentry-postgres-data:
